# Deployments Model-Router may select. Enable rows you have credentials for.
# Ids must match keys in benchmarks.yaml.
# Fireworks via LiteLLM: fireworks_ai/accounts/fireworks/models/<id>
# (FIREWORKS_API_KEY / OPENAI_API_KEY / ANTHROPIC_API_KEY in .env — never commit .env)
deployments:
  # Frontier / high intelligence (OpenAI + Anthropic)
  - id: openai/gpt-5.6-sol
    litellm_model: openai/gpt-5.6-sol
    enabled: true

  - id: anthropic/claude-fable-5
    litellm_model: anthropic/claude-fable-5
    enabled: true

  - id: anthropic/claude-opus-5
    litellm_model: anthropic/claude-opus-5
    enabled: true

  - id: anthropic/claude-sonnet-5
    litellm_model: anthropic/claude-sonnet-5
    enabled: true

  - id: openai/gpt-5.6-terra
    litellm_model: openai/gpt-5.6-terra
    enabled: true

  - id: openai/gpt-5.6-luna
    litellm_model: openai/gpt-5.6-luna
    enabled: true

  # Open-weight defaults on Together.ai serverless (TOGETHER_API_KEY).
  # Stable public catalog IDs stay provider-neutral; provider-specific Fireworks
  # aliases below remain available for explicit fallback testing.
  - id: moonshot/kimi-k3
    litellm_model: together_ai/moonshotai/Kimi-K3
    enabled: true
    auto_select: false

  - id: zai/glm-5.2
    litellm_model: together_ai/zai-org/GLM-5.2
    enabled: true
    auto_select: false

  - id: deepseek/deepseek-v4-pro
    litellm_model: together_ai/deepseek-ai/DeepSeek-V4-Pro-0813
    enabled: true
    # Validated by live 50-scenario run 20261011T014553Z.
    auto_select: true

  - id: minimax/minimax-m3
    litellm_model: together_ai/MiniMaxAI/MiniMax-M3
    enabled: true
    # Validated by live 50-scenario run 20261011T014959Z.
    auto_select: true

  # Explicit Fireworks alternates. These aliases are passthrough-only because
  # they intentionally have no benchmark rows and therefore are not auto-selected.
  - id: fireworks/kimi-k3
    litellm_model: fireworks_ai/accounts/fireworks/models/kimi-k3
    enabled: true
    auto_select: false

  - id: fireworks/glm-5.2
    litellm_model: fireworks_ai/accounts/fireworks/models/glm-5p2
    enabled: true
    auto_select: false

  - id: fireworks/deepseek-v4-pro
    litellm_model: fireworks_ai/accounts/fireworks/models/deepseek-v4-pro
    enabled: true
    auto_select: false

  - id: fireworks/minimax-m3
    litellm_model: fireworks_ai/accounts/fireworks/models/minimax-m3
    enabled: true
    auto_select: false

  # Llama 4 / 3.3 — remap when available on your account
  - id: meta-llama/llama-4-maverick
    litellm_model: fireworks_ai/accounts/fireworks/models/llama4-maverick-instruct-basic
    enabled: false

  - id: meta-llama/llama-4-scout
    litellm_model: fireworks_ai/accounts/fireworks/models/llama4-scout-instruct-basic
    enabled: false

  - id: meta-llama/llama-3.3-70b-instruct
    litellm_model: fireworks_ai/accounts/fireworks/models/llama-v3p3-70b-instruct
    enabled: false

  # Legacy OpenAI
  - id: openai/gpt-4o
    litellm_model: openai/gpt-4o
    enabled: true

  - id: openai/gpt-4o-mini
    litellm_model: openai/gpt-4o-mini
    enabled: true

  # Together.ai serverless (TOGETHER_API_KEY) — see docs/TOGETHER.md
  - id: together/deepseek-v4.1-flash
    litellm_model: together_ai/deepseek-ai/DeepSeek-V4.1-Flash
    enabled: true
    auto_select: false

  - id: together/deepseek-v4-pro
    litellm_model: together_ai/deepseek-ai/DeepSeek-V4-Pro-0813
    enabled: true
    auto_select: false

  - id: together/glm-5.3-flash
    litellm_model: together_ai/zai-org/GLM-5.3-Flash
    enabled: true
    auto_select: false
