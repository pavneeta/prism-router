# Public benchmark catalog (see docs/BENCHMARKS.md for provenance and caveats).
schema_version: 1
snapshot_date: "2026-10-11"
sources_docs: docs/BENCHMARKS.md

# Raw source keys (optional per model):
#   deepswe                 — pass@1 [0,1]  DeepSWE v1.1 / mini-swe-agent
#   swe_bench_verified      — % resolved [0,1] official mini-SWE-agent rows only
#   swe_rebench_resolved    — resolved rate [0,1] latest SWE-rebench window
#   terminal_bench_v2_1     — pass@1 [0,1] historical AA Terminal-Bench (routing)
#   terminal_bench_2        — accuracy [0,1] official Terminal-Bench 2.0 (diagnostic)
#   aa_intelligence_index   — Artificial Analysis Intelligence Index (raw, ~0-70)
#   arena_elo               — LMArena text style-control overall rating
#   arena_coding_elo        — LMArena text style-control coding rating (diagnostic)
#
# Task accuracies are derived on load unless overridden under `accuracy:`.

source_snapshots:
  deepswe:
    url: https://deepswe.datacurve.ai/artifacts/v1.1/leaderboard-live.json
    snapshot_date: "2026-09-22"
    metric: "pass@1; mini-swe-agent; highest published effort"
  swe_bench_verified:
    url: https://www.swebench.com/index.html
    snapshot_date: "2026-10-11"
    metric: "% resolved; official mini-SWE-agent rows only"
  swe_rebench_resolved:
    url: https://swe-rebench.com/
    snapshot_date: "2026-07-01"
    metric: "Resolved Rate; latest public window; exact model rows"
  terminal_bench_v2_1:
    status: "retained historical AA-sourced routing scores from 2026-07"
    note: "Official Terminal-Bench 2.0 uses a different scale and is stored separately."
  terminal_bench_2:
    url: https://www.tbench.ai/leaderboard/terminal-bench/2.0
    snapshot_date: "2026-10-11"
    data_through: "2026-09-29"
    metric: "accuracy; official model+agent row; max reasoning effort; diagnostic only"
  lmarena:
    url: https://huggingface.co/datasets/lmarena-ai/leaderboard-dataset
    snapshot_date: "2026-10-08"
    metric: "Bradley-Terry Arena rating; text_style_control latest; overall and coding"
  artificial_analysis:
    url: https://artificialanalysis.ai/data-api/docs
    status: "unavailable without x-api-key; no key used"
    current_version_seen: "4.3.2"
    retained_score_snapshot: "2026-07"
    note: "Existing AA values are historical and were not refreshed."
  skipped:
    livecodebench: "Not mapped: execution pass@1 is not directly comparable to current router agent metrics."
    tau_bench: "Not mapped: domain/tool-policy and harness variants do not match a catalog source key."

