<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Prism Router">
  <rect width="64" height="64" rx="12" fill="#0a1418"/>
  <defs>
    <linearGradient id="g" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#2a3a44" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#1a2830" stop-opacity="0.85"/>
    </linearGradient>
  </defs>
  <!-- inbound beam -->
  <rect x="6" y="30.5" width="16" height="2.5" fill="#5ec8d4" opacity="0.85"/>
  <!-- prism -->
  <polygon points="22,14 44,32 22,50" fill="url(#g)" stroke="#5ec8d4" stroke-opacity="0.7" stroke-width="1.5"/>
  <polygon points="25,20 39,32 25,44" fill="#5ec8d4" fill-opacity="0.08" stroke="#f0f4f6" stroke-opacity="0.2" stroke-width="0.75"/>
  <!-- spectrum fan -->
  <path d="M44 32 L58 22" stroke="#4ec4d4" stroke-width="2" stroke-linecap="round"/>
  <path d="M44 32 L58 27" stroke="#5fd48a" stroke-width="2" stroke-linecap="round"/>
  <path d="M44 32 L58 32" stroke="#e0c84a" stroke-width="2" stroke-linecap="round"/>
  <path d="M44 32 L58 37" stroke="#e89a4a" stroke-width="2" stroke-linecap="round"/>
  <path d="M44 32 L58 42" stroke="#e05a4a" stroke-width="2" stroke-linecap="round"/>
  <circle cx="22" cy="32" r="1.75" fill="#5ec8d4"/>
  <circle cx="44" cy="32" r="1.75" fill="#e0b85a"/>
</svg>
