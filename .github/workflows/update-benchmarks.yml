# Monthly (and on-demand) refresh of config/benchmarks.yaml from public leaderboards.
# No provider API secrets required for the scrape itself.

name: Update benchmarks

on:
  schedule:
    # 06:00 UTC on the 1st of each month
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-benchmarks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "pyyaml>=6.0.2"

      - name: Refresh benchmarks
        id: refresh
        run: |
          mkdir -p logs
          python scripts/update_benchmarks.py \
            --summary logs/benchmark_update_summary.md \
            -v
          {
            echo "SUMMARY<<SUMMARY_EOF"
            cat logs/benchmark_update_summary.md
            echo "SUMMARY_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Month stamp
        id: stamp
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Create pull request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: monthly benchmark refresh (${{ steps.stamp.outputs.month }})"
          branch: chore/benchmark-refresh-${{ steps.stamp.outputs.month }}
          delete-branch: true
          title: "chore: monthly benchmark refresh (${{ steps.stamp.outputs.month }})"
          body: |
            Automated monthly refresh of `config/benchmarks.yaml` from public leaderboard sources (best-effort; no provider API keys).

            ## Summary
            ${{ steps.refresh.outputs.SUMMARY }}

            See [docs/BENCHMARKS.md](docs/BENCHMARKS.md) and [docs/CI.md](docs/CI.md).
          add-paths: |
            config/benchmarks.yaml
