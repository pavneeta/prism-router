name: Bug report
description: Something broken in the gateway, routing, or docs
title: "[bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Steps to reproduce, expected vs actual
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or release
      placeholder: main @ abc1234 or v0.1.0
  - type: dropdown
    id: deploy
    attributes:
      label: Environment
      options:
        - Local (`model-router`)
        - Docker / GHCR
        - Railway or other cloud
        - Docs / website only
