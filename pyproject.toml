[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "model-router"
version = "0.3.0"
description = "Intelligence-aware AI inference router that picks the right model per task"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Pavneet Ahluwalia" }]
keywords = ["llm", "routing", "litellm", "openai-compatible", "prompt-cache"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "litellm>=1.55.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "pyyaml>=6.0.2",
  "python-dotenv>=1.0.1",
  "httpx>=0.27.0",
  "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
]
redis = [
  "redis>=5.0.0",
]

[project.urls]
Homepage = "https://prism-router-ten.vercel.app"
Documentation = "https://prism-router-ten.vercel.app/docs"
Repository = "https://github.com/pavneeta/prism-router"
Issues = "https://github.com/pavneeta/prism-router/issues"

[project.scripts]
model-router = "model_router.cli:main"
prism = "model_router.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/model_router"]

# Editable installs resolve imports from src/
[tool.hatch.build.targets.editable]
redirects = { "model_router" = "src/model_router" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src", "."]
testpaths = ["tests"]
